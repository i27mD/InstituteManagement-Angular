<div class="page-wrapper">
  <h2 class="page-title">Manage Users</h2>

  <!-- صندوق إضافة/تعديل مستخدم -->
  <div class="form-card">
    <h3 class="form-title">{{ currentUser.userId === 0 ? 'Add New User' : 'Edit User' }}</h3>
    
    <div class="form-row">
      <input type="text" [(ngModel)]="currentUser.username" placeholder="Username" class="custom-input" />
      <input type="email" [(ngModel)]="currentUser.email" placeholder="Email" class="custom-input" />
      
      <!-- حقل كلمة المرور يظهر فقط عند الإضافة -->
      <input *ngIf="currentUser.userId === 0" type="password" [(ngModel)]="currentUser.password" placeholder="Password" class="custom-input" />
      
      <!-- قائمة الصلاحيات المنسدلة -->
      <select [(ngModel)]="currentUser.role" class="custom-input custom-select">
        <option value="ExpertAdmin">Expert Admin</option>
        <option value="Admin">Admin</option>
      </select>
      
      <!-- أزرار الحفظ والإلغاء -->
      <button (click)="saveUser()" class="outline-btn btn-primary">
        {{ currentUser.userId === 0 ? 'Save' : 'Update' }}
      </button>
      <button (click)="resetForm()" class="outline-btn btn-secondary">Clear</button>
    </div>
  </div>

  <!-- قسم البحث -->
  <div class="search-section">
    <input type="text" [(ngModel)]="searchKeyword" placeholder="Search by username, email or role..." class="custom-input search-input" />
    <button (click)="search()" class="outline-btn btn-primary search-btn">Search</button>
  </div>

  <!-- جدول عرض البيانات -->
  <div class="table-container">
    <table class="custom-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Email</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of usersList">
          <td>{{ user.userId }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          
          <!-- عرض الصلاحية كملصق احترافي (Badge) -->
          <td>
            <span class="role-badge" 
                  [class.role-expert]="user.role === 'ExpertAdmin'" 
                  [class.role-admin]="user.role === 'Admin'">
              {{ user.role }}
            </span>
          </td>
          
          <td class="action-cell">
            <!-- أزرار العمليات (أزرق، برتقالي، أحمر) -->
            <button (click)="viewUser(user.userId)" class="action-btn btn-view">View</button>
            <button (click)="editUser(user)" class="action-btn btn-edit">Edit</button>
            <button (click)="delete(user.userId)" class="action-btn btn-delete">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
