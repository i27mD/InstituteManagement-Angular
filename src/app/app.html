<!-- شريط التنقل يظهر فقط إذا كان المستخدم مسجلاً -->
<nav class="navbar" *ngIf="isLoggedIn">
  <div class="nav-links">
    <a [routerLink]="['/dashboard']" routerLinkActive="active">Dashboard</a>
    <a [routerLink]="['/students']" routerLinkActive="active">Students</a>
    <a [routerLink]="['/teachers']" routerLinkActive="active">Teachers</a>
    <a [routerLink]="['/courses']" routerLinkActive="active">Courses</a>
    <a [routerLink]="['/enrollments']" routerLinkActive="active">Enrollments</a>
    <a [routerLink]="['/users']" routerLinkActive="active">Users</a>
  </div>
  
  <div class="nav-actions">
    <!-- زر تسجيل الخروج -->
    <a class="logout-btn" (click)="logout()">Logout</a>
  </div>
</nav>

<!-- هنا الحل: الكلاس يطبق المسافات (padding) فقط إذا كان مسجل دخول -->
<main [class.main-container]="isLoggedIn">
  <h1 class="welcome-header" *ngIf="isLoggedIn">Hello, {{name}} Welcome to Our Website CourseHub</h1>
  
  <!-- مساحة عرض الصفحات -->
  <router-outlet></router-outlet>
</main>
